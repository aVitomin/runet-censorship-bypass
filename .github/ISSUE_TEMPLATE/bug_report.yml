name: Сообщить об ошибке
description: Не работает установка, маршрутизация или интерфейс
title: "[Bug]: "
labels:
  - bug
body:
  - type: markdown
    attributes:
      value: |
        Сначала проверьте [раздел помощи](https://github.com/aVitomin/runet-censorship-bypass/blob/main/SUPPORT.md) и похожие обращения.
        Об уязвимостях сообщайте [приватно](https://github.com/aVitomin/runet-censorship-bypass/security/advisories/new).
        Не прикладывайте экспорт настроек, профили, HAR/NetLog, пароли или частные адреса.
  - type: input
    id: environment
    attributes:
      label: Браузер и операционная система
      placeholder: "Например: Firefox 156.0.1, Windows 11"
    validations:
      required: true
  - type: input
    id: extension_version
    attributes:
      label: Версия расширения
      description: Указана на странице расширений браузера или в разделе «О программе».
      placeholder: "Например: 1.0.0"
    validations:
      required: true
  - type: dropdown
    id: installation
    attributes:
      label: Как установлено
      options:
        - Chromium — ZIP из GitHub, распакованная установка
        - Firefox — подписанный XPI из GitHub
        - Chrome Web Store
        - Firefox Add-ons
        - Локальная сборка или временная установка для разработки
        - Другой способ или неизвестно
    validations:
      required: true
  - type: textarea
    id: reproduction
    attributes:
      label: Что произошло и как повторить
      description: Опишите шаги, ожидаемый и фактический результат.
      placeholder: |
        Шаги: …
        Ожидалось: …
        Получилось: …
    validations:
      required: true
  - type: textarea
    id: context
    attributes:
      label: Состояние и дополнительные сведения
      description: "Необязательно: Авто/Прокси/Напрямую, выбранный источник, видимая ошибка или снимок без личных данных. В 1.0 можно приложить просмотренный «Экспорт для поддержки», но не экспорт настроек."
  - type: checkboxes
    id: privacy
    attributes:
      label: Перед отправкой
      options:
        - label: Я проверил(а), что текст и вложения не содержат секретов, частных адресов, истории посещений или деталей уязвимости. Для запроса `[Security contact]` оставлены только contact-only сведения.
          required: true
