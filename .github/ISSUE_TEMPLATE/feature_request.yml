name: Предложить улучшение
description: Идея для расширения или документации
title: "[Feature]: "
labels:
  - enhancement
body:
  - type: markdown
    attributes:
      value: |
        Опишите задачу своими словами. Не добавляйте учётные данные, частные адреса или историю посещений.
  - type: textarea
    id: problem
    attributes:
      label: Какую задачу хотите решить
      description: Что сейчас неудобно или невозможно?
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Как должно работать
      description: Предложите поведение или приведите пример.
    validations:
      required: true
  - type: dropdown
    id: browser_scope
    attributes:
      label: Для какого браузера
      options:
        - Chromium и Firefox
        - Только Chromium
        - Только Firefox
        - Документация или другое
  - type: textarea
    id: alternatives
    attributes:
      label: Дополнения
      description: "Необязательно: альтернативы, ограничения, примеры или снимок без личных данных."
