name: Предложить улучшение
description: Предложение для опубликованного расширения Chromium/Firefox или документации
title: "[Feature]: "
labels:
  - enhancement
body:
  - type: markdown
    attributes:
      value: |
        Опишите пользовательскую задачу и ожидаемый результат. Не добавляйте пароли, учётные данные, токены, cookies, приватные адреса, URL без очистки, содержимое приватного PAC или историю посещений.
  - type: textarea
    id: problem
    attributes:
      label: Какая проблема решается
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Предлагаемое поведение
    validations:
      required: true
  - type: dropdown
    id: browser_scope
    attributes:
      label: Для какого браузера
      options:
        - Chromium и Firefox
        - Только Chromium
        - Только Firefox
        - Не зависит от браузера
        - Неизвестно
    validations:
      required: true
  - type: dropdown
    id: area
    attributes:
      label: Область
      options:
        - Окно расширения и маршрут текущего сайта
        - Настройки и удобство использования
        - PAC и источники маршрутов
        - Прокси, Tor или авторизация
        - Обновления, состояние и диагностика
        - Документация и установка
        - Разработка, тестирование или выпуск
        - Другое
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: Альтернативы и ограничения
      description: Укажите известное влияние на приватность, разрешения, маршрутизацию и совместимость.
  - type: checkboxes
    id: privacy
    attributes:
      label: Проверка приватности
      options:
        - label: Предложение не содержит паролей, учётных данных, токенов, cookies, приватных адресов или URL без очистки, содержимого приватного PAC и истории посещений.
          required: true
